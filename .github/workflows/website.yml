name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "!website/design/**"
      - "!website/screenshots/**"
      - "!website/AGENTS.md"
      - "!website/README.md"
      - "documentation.md"
      - "learn/**"
      - "reference/**"
      - "library/**"
      - "seed/prelude/**/*.cinch"
      - "tooling/editors/vscode/syntaxes/cinch.tmLanguage.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "!website/design/**"
      - "!website/screenshots/**"
      - "!website/AGENTS.md"
      - "!website/README.md"
      - "documentation.md"
      - "learn/**"
      - "reference/**"
      - "library/**"
      - "seed/prelude/**/*.cinch"
      - "tooling/editors/vscode/syntaxes/cinch.tmLanguage.json"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-build:
    name: Astro check, build, and preview audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Vercel ignore-step logic
        run: bash scripts/test-vercel-ignore.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Astro and content schemas
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Audit built routes, links, downloads, and search
        run: |
          npm run verify:preview
          npm run verify:downloads
          npm run verify:hoogle

name: Compiler distributions

on:
  push:
    branches: [main, "lane/**", "claude/**"]
    paths:
      - "compiler/**"
      - "tooling/**"
      - "seed/prelude/**"
      - "examples/compiler/fib.cinch"
      - "flake.nix"
      - "flake.lock"
      - "devenv.nix"
      - ".github/workflows/ladder-cache.yml"
  pull_request:
    paths:
      - "compiler/**"
      - "tooling/**"
      - "seed/prelude/**"
      - "examples/compiler/fib.cinch"
      - "flake.nix"
      - "flake.lock"
      - "devenv.nix"
      - ".github/workflows/ladder-cache.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish a nightly prerelease after all platform builds pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compiler-distributions-${{ github.workflow }}-${{ (github.event_name == 'schedule' || inputs.publish_nightly) && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ladder:
    name: Compiler (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      CACHIX_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require cache publishing credentials on trusted builds
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::Set the CACHIX_AUTH_TOKEN repository secret to a cinch cache read/write token.'
            exit 1
          fi
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Pull from Cachix and publish trusted builds
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: cinch
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - name: Check the native platform
        shell: bash
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
      # Preserve the expensive pin-keyed outputs even if the current
      # compiler fails its fixed-point or smoke checks.
      - name: Build the pinned compilers and runtime
        run: nix build -L --accept-flake-config .#cinch-pins --out-link result-pins
      - name: Build and check the self-hosted compiler
        run: nix build -L --accept-flake-config .#cinch-ladder --out-link result-ladder
      - name: Package and verify the native Stage 3 binary
        env:
          CINCH_DIST_SYSTEM: ${{ matrix.system }}
        run: |
          python3 tooling/package-nightly.py --ladder result-ladder \
            --system "$CINCH_DIST_SYSTEM" --revision "$GITHUB_SHA" --out dist
          cp tooling/nightly-release.md dist/README.md
      - name: Upload the compiler distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinch-${{ matrix.system }}-${{ github.sha }}
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  nightly:
    name: Publish nightly release
    needs: ladder
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the three checked distributions
        env:
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --pattern 'cinch-*' --dir artifacts
      - name: Prepare release assets and checksums
        run: |
          mkdir -p release
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            artifact="artifacts/cinch-${system}-${GITHUB_SHA}"
            (cd "$artifact" && sha256sum --check "cinch-${system}.sha256")
            cp "$artifact/cinch-${system}" "$artifact/cinch-${system}.sha256" "$artifact/build-${system}.json" release/
          done
          cp "artifacts/cinch-x86_64-linux-${GITHUB_SHA}/README.md" release/README.md
          cat release/*.sha256 > release/SHA256SUMS
          cat > notes.md <<EOF_NOTES
          Native compiler distributions built from ${GITHUB_SHA}.

          All three platforms passed the bootstrap fixed point, stage smokes, interface consumption and changed-source checks.

          Download the native Stage 3 executable for your platform and make it executable with chmod +x. See README.md for usage. Each binary has a SHA-256 sidecar; SHA256SUMS covers all three. Linux binaries are statically linked; macOS uses only system libraries.

          Build: https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}
          EOF_NOTES
      - name: Publish a complete dated prerelease
        run: |
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          # Stage all assets on a draft, then expose the complete release.
          # Re-running this job resumes the same draft or completed release.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Cinch nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:8})" --notes-file notes.md
          fi
          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false

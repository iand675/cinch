<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Cinch gradient-gold fox</title><desc id="desc">Nine-tailed orange fox with slender legs and a geometric impossible knot halo. All gold is made from simple linear gradients. Fully vector artwork without textures or embedded images.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0.18" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#F6DEA0"/><stop offset=".48" stop-color="#D6A747"/><stop offset="1" stop-color="#9B6927"/>
  </linearGradient>
  <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FAE6B4"/><stop offset="1" stop-color="#D1A24C"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2=".75" y2="1">
    <stop stop-color="#E97B29"/><stop offset="1" stop-color="#B94B1E"/>
  </linearGradient>
  <linearGradient id="orangeSide" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#B64D23"/><stop offset="1" stop-color="#793D23"/>
  </linearGradient>
  <clipPath id="leftJoin"><path d="M20 340H195V510H20Z"/></clipPath>
  <g id="beam">
    <path d="M300 42 545 466 445 466 250 129Z" fill="url(#gold)" stroke="#774B27" stroke-width="2" stroke-linejoin="round"/>
    <path d="M300 65 521 448 455 448 267 123Z" fill="url(#orange)"/>
    <path d="M300 65 321 101 289 157 267 123Z" fill="url(#goldLight)"/>
    <path d="M321 101 521 448 499 448 310 121Z" fill="url(#orangeSide)"/>
    <path d="M310 121 499 448" fill="none" stroke="#EDCA7C" stroke-width="2"/>
  </g>
  <g id="impossibleKnot">
    <use href="#beam" transform="rotate(120 300 324.9)"/>
    <use href="#beam"/>
    <use href="#beam" transform="rotate(240 300 324.9)"/>
    <g clip-path="url(#leftJoin)"><use href="#beam" transform="rotate(120 300 324.9)"/></g>
  </g>
</defs>

id = "cinch"
name = "Cinch"
version = "0.1.0"
schema_version = 1
description = "Cinch surface syntax and Cinch Core: tree-sitter grammars, editor queries, and the cinch language server"
authors = ["Cinch design repository"]
repository = "https://github.com/mercurytechnologies/designing-a-safe-language"
languages = ["languages/cinch", "languages/cinch-core"]
capabilities = []

[lib]
kind = "Rust"
version = "0.7.0"

# Zed clones this repository, checks out `rev`, and compiles the generated
# parser in `src/` into a wasm grammar. The generated parser is not committed
# to this repository, so sync-grammar.sh builds a small local git repository
# holding grammar.js plus the generated src/ and rewrites the `repository` and
# `rev` values below, once per grammar. All four values are therefore
# machine-local: run `tooling/editors/zed/sync-grammar.sh` before installing
# the extension.
[grammars.cinch]
repository = "file:///Users/ian/Code/personal/designing-a-safe-language/tooling/editors/zed/grammar-repo"
rev = "3f5bf829a283d8310d8f5d1c457f8d9f1d8df149"

# The Core grammar (design/core-output.md section 8.2). Until
# sync-grammar.sh runs, `rev` is the placeholder below and the repository
# directory does not exist, so installing the extension fails with Zed's
# fetch error. That is deliberate: the pin is machine-local.
[grammars.cinch-core]
repository = "file:///Users/ian/Code/personal/designing-a-safe-language/tooling/editors/zed/grammar-repo-core"
rev = "0000000000000000000000000000000000000000"

[language_servers.cinch-lsp]
name = "Cinch Language Server"
languages = ["Cinch", "Cinch Core"]

[language_servers.cinch-lsp.language_ids]
"Cinch" = "cinch"
"Cinch Core" = "cinch-core"

name = "Cinch"
grammar = "cinch"
path_suffixes = ["cinch"]
line_comments = ["-- "]
block_comment = { start = "{-", prefix = "", end = "-}", tab_size = 0 }
tab_size = 2
hard_tabs = false
autoclose_before = ")]},"
word_characters = ["'"]
completion_query_characters = ["."]

# `not_in` names come from overrides.scm, not from grammar node names.
brackets = [
    { start = "(", end = ")", close = true, newline = false, not_in = ["string", "raw"] },
    { start = "[", end = "]", close = true, newline = false, not_in = ["string", "raw"] },
    { start = "[|", end = "|]", close = true, newline = false, not_in = ["string", "raw"] },
    { start = "{", end = "}", close = true, newline = true, not_in = ["string", "raw"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "raw"] },
]

# A `.` inside a string is field projection text, not a completion request.
[overrides.string]
completion_query_characters = []

[overrides.raw]
completion_query_characters = []

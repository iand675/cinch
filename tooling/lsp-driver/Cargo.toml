[package]
name = "cinch-lsp"
version = "0.1.0"
edition = "2021"
description = "Run the Cinch language server over stdio (LspServer::run)"
license = "UNLICENSED"

# Deliberately standalone (no workspace): a two-file driver around the
# cinch library's hand-rolled LSP (compiler/src/lsp.rs).
[[bin]]
name = "cinch-lsp"
path = "src/main.rs"

[dependencies]
cinch = { path = "../../compiler" }

[package]
name = "cinchruntime"
version = "0.1.0"
edition = "2021"
description = "Runtime library for generated Cinch code: bignum Nat/Int, allocation, defined fault paths"
license = "UNLICENSED"

# Standalone package root: keeps this crate buildable on its own even if the
# parent compiler package ever becomes a workspace root.
[workspace]

[lib]
name = "cinchruntime"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]

# `--cfg cinch_thread_tasks` builds the one-OS-thread-per-task backend of
# `src/sched/thread.rs` on a target that has fibers, so the fallback every
# other target gets can be compiled and tested here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cinch_thread_tasks)'] }

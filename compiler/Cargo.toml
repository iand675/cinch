[package]
name = "cinch"
version = "0.1.0"
edition = "2021"
description = "Bootstrap compiler for the safe language design, draft 0.2 surface"
license = "UNLICENSED"

[lib]
name = "cinch"
path = "src/lib.rs"

[[bin]]
name = "cinch"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
unicode-width = "0.2"

[build-dependencies]
cc = "1"
